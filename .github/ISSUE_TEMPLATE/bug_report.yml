name: Bug Report
description: Report a reproducible bug in deusbr
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Concise description of the issue and expected behavior.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction Steps & Environment
      description: OS, Node.js version, exact command run, and test output (`node -e "const fs=require('fs');const m=fs.readFileSync('README.md','utf8');if(m.includes('include_all_commits=true'))throw 1;if(!m.includes('show=reviews'))throw 2;"`).
    validations:
      required: true
